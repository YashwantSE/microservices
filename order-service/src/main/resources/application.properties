spring.application.name=order-service
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/order-service?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pass123
spring.jpa.hibernate.ddl-auto=update

# because  order service working on different port
eureka.instance.hostname=localhost


## where we are going to find the eureka server
# URL	                        Purpose
#http://localhost:8761	        Eureka Dashboard (UI)
#http://localhost:8761/eureka	REST endpoint used by Eureka clients
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#Acuator -
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


#Reliance4j properties
resilience4j.circuitbreaker.instances.inventory-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instance.inventory-service.event-consumer-breaker-size=10
resilience4j.circuitbreaker.instance.inventory-service.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory-service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventory-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory-service.automaticTransactionFormationFromOpenToHalfOpenEnabled=true

# resilience4j timeout properties
resilience4j.timelimiter.instances.inventory-service.timeout-duration=3s

# resilience4j Retry mechanism
resilience4j.retry.instances.inventory-service.max-attempts=3
resilience4j.retry.instances.inventory-service.wait-duration=5s


#Zipkin
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
